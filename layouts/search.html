{{ define "main" }}
{{- $index := .OutputFormats.Get "SearchIndex" }}
<header class="list-head">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}
  <div class="intro">{{ . }}</div>
  {{- end }}
</header>
<div class="list-body search">
  {{- /* Without JavaScript the form falls back to a DuckDuckGo search of this site. */}}
  <form class="search-form" role="search" action="https://duckduckgo.com/" method="get"
    data-search-form{{ with $index }} data-index="{{ .RelPermalink }}"{{ end }}
    data-msg-one="{{ T "searchResultOne" (dict "Query" "{q}") }}"
    data-msg-many="{{ T "searchResultMany" (dict "Count" "{n}" "Query" "{q}") }}"
    data-msg-none="{{ T "searchNoResults" (dict "Query" "{q}") }}"
    data-msg-error="{{ T "searchError" }}">
    <label for="search-q" class="visually-hidden">{{ T "searchLabel" }}</label>
    <input id="search-q" name="q" type="search" placeholder="{{ T "searchPlaceholder" (dict "Site" site.Title) }}"
      autocomplete="off" spellcheck="false" data-search-input>
    <input type="hidden" name="sites" value="{{ (urls.Parse site.BaseURL).Host }}">
    <button type="submit">{{ T "searchButton" }}</button>
  </form>
  <p class="search-status" role="status" aria-live="polite" data-search-status></p>
  <ol class="entries search-results" data-search-results></ol>
</div>
{{ end }}
