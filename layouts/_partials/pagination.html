{{- with . }}{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="{{ T "pages" }}">
  {{- if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">{{ T "newerPage" }}</a>{{ else }}<span></span>{{ end }}
  <span class="folio">{{ T "pageOf" (dict "Page" (partial "roman.html" .PageNumber) "Total" (partial "roman.html" .TotalPages)) }}</span>
  {{- if .HasNext }}<a href="{{ .Next.URL }}" rel="next">{{ T "olderPage" }}</a>{{ else }}<span></span>{{ end }}
</nav>
{{- end }}{{ end }}
