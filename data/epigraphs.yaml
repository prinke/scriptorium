- text: "Faith seeking understanding."
  source: "Anselm of Canterbury, *Proslogion*"
- text: "The light shines in the darkness, and the darkness has not overcome it."
  source: "John 1:5"
- text: "Late have I loved you, beauty so ancient and so new."
  source: "Augustine, *Confessions* X.27"
- text: "Programs must be written for people to read, and only incidentally for machines to execute."
  source: "Abelson & Sussman, *SICP*"
- text: "Simplicity is prerequisite for reliability."
  source: "Edsger W. Dijkstra"
- text: "It is the glory of God to conceal things, but the glory of kings is to search things out."
  source: "Proverbs 25:2"
